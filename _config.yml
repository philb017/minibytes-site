title: minibytes
tagline: IT notes, commands & config snippets
hero_title: Practical notes for real systems
description: >-
  Practical sysadmin reference notes: hardware configs, Windows/Linux
  commands, and the occasional detour into kitesurfing.
url: "https://minibytes.com.au"
baseurl: ""

markdown: kramdown
highlighter: rouge

permalink: /:year/:month/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Top navigation. "Hardware" and "Software" are dropdown groups of
# category archive pages (see /category/*.md); "Notes" links straight
# to standalone pages.
nav:
  - title: Networking
    items:
      - title: FortiGate
        url: /category/fortigate/
      - title: MikroTik
        url: /category/mikrotik/
      - title: Ubiquiti
        url: /category/ubiquiti/
      - title: Other
        url: /category/other/
  - title: Systems
    items:
      - title: Containers
        url: /category/containers/
      - title: Linux
        url: /category/linux/
      - title: Security
        url: /category/security/
      - title: Virtualization
        url: /category/virtualization/
  - title: Microsoft
    items:
      - title: M365
        url: /category/m365/
      - title: PowerShell
        url: /category/powershell/
      - title: Windows
        url: /category/windows/
  - title: Off Topic
    items:
      - title: Kitesurfing
        url: /kitesurfing/
      - title: Gallery
        url: /gallery/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
