---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %b %Y" }}</time>
    {% if page.category %}<a class="cat-tag {{ page.category | slugify | prepend: 'cat-' }}" href="{{ page.category | slugify | prepend: '/category/' | append: '/' | relative_url }}">{{ page.category }}</a>{% endif %}
  </p>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/' | relative_url }}">&larr; Back to all posts</a></p>
</article>
